      <stop offset="0%" stop-color="#081019" />
      <stop offset="55%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.22" r="0.7">
