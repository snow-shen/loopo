    </radialGradient>
    <radialGradient id="glowB" cx="0.78" cy="0.3" r="0.58">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0" />
